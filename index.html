<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            padding: 20px;
        }
        h1 {
            color: #ff477e;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        p.hint {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        /* Sweet "Pookie" Font Message Styling */
        .birthday-message {
            font-family: 'Caveat', 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            color: #ff477e;
            font-size: 24px;
            line-height: 1.6;
            margin-bottom: 30px; /* Space between message and gallery */
            text-shadow: 1px 1px 1px rgba(0,0,0,0.05);
        }
        .birthday-message .main-wish {
            font-size: 32px;
            font-weight: bold;
            color: #d9386a;
            margin-bottom: 5px;
        }
        .birthday-message .sub-text {
            color: #555;
            font-size: 22px;
        }

        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 700px;
            perspective: 1000px; /* Gives 3D depth during movement */
        }
        .photo-card {
            background: white;
            padding: 10px 10px 20px 10px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.05s ease-out, box-shadow 0.3s ease; /* Snappier transition for intense jiggle */
            position: relative;
            width: 180px; 
            transform-style: preserve-3d;
        }
        .photo-card:hover {
            box-shadow: 0 12px 20px rgba(0,0,0,0.2);
        }
        .photo-card img {
            width: 100%;
            height: 210px; 
            object-fit: cover;
            border-radius: 4px;
            pointer-events: none;
        }

        /* Message Box Style */
        .message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            padding: 20px;
        }
        .message-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .message-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        .message-overlay.active .message-box {
            transform: scale(1);
        }
        .message-box h2 {
            color: #ff477e;
            margin-bottom: 15px;
        }
        .message-box p {
            color: #333;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #ff477e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .close-btn:hover {
            background: #ff7096;
        }
        /* Secure Permission Request Banner */
        #permission-banner {
            display: none;
            background: white;
            padding: 15px 25px;
            border-radius: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 99;
        }
        #permission-btn {
            background: #ff477e;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <h1>Hey! ✨</h1>
    <p class="hint">(Try tilting/jiggle your mobile phone or click a picture)</p>
    
    <div id="permission-banner">
        <span>Enable fluid motion effect?</span>
        <button id="permission-btn">Yes, Turn On</button>
    </div>

    <div class="birthday-message">
        <div class="main-wish">happy birthday amu</div>
        <div class="sub-text">enjoy ur day and do the stuffs what u wanna do</div>
        <div class="sub-text">in return i don't want anything 👍</div>
    </div>

    <div class="gallery-container">
        <div class="photo-card" onclick="showMessage('You look beautiful in this picture! 😊')">
            <img src="pic1.jpg" alt="Photo 1">
        </div>
        
        <div class="photo-card" onclick="showMessage('This one has a great vibe! ✨')">
            <img src="pic2.jpg" alt="Photo 2">
        </div>

        <div class="photo-card" onclick="showMessage('Keep smiling always! 🌸')">
            <img src="pic3.jpg" alt="Photo 3">
        </div>
    </div>

    <div class="message-overlay" id="msg-overlay">
        <div class="message-box">
            <h2>A Message For You</h2>
            <p id="popup-text">Custom Text Goes Here</p>
            <button class="close-btn" onclick="closeMessage()">Close</button>
        </div>
    </div>

    <script>
        // Webpage khullei prothome eita run hobe
        const password = prompt("Enter the secret key to enter:");
        if (password !== "msd07") { 
            alert("Wrong password!");
            document.body.innerHTML = "<h2 style='color:#ff477e; text-align:center; margin-top:20vh;'>Access Denied. 🔒</h2>";
        }

        const cards = document.querySelectorAll('.photo-card');
        const overlay = document.getElementById('msg-overlay');
        const popupText = document.getElementById('popup-text');
        const permissionBanner = document.getElementById('permission-banner');
        const permissionBtn = document.getElementById('permission-btn');

        // --- Handlers for Increased Jiggle / Motion Tracking ---
        function handleMotion(event) {
            let tiltX = event.gamma ? event.gamma : 0; 
            let tiltY = event.beta ? event.beta : 0;   

            // Limits how far the sensors track
            let moveX = Math.max(-30, Math.min(30, tiltX));
            let moveY = Math.max(-30, Math.min(30, tiltY - 45)); 

            cards.forEach((card, index) => {
                // INCREASED MULTIPLIERS: Boosted from 0.75/0.45 to 2.5/1.8 for dramatic motion
                let multiplier = (index % 2 === 0) ? 2.5 : 1.8;
                let currentX = moveX * multiplier;
                let currentY = moveY * multiplier;
                
                // INCREASED ROTATION SENSITIVITY: Changed from 0.1 to 0.4 for distinct 3D turning
                card.style.transform = `translate3d(${currentX}px, ${currentY}px, 0px) rotateY(${currentX * 0.4}deg) rotateX(${-currentY * 0.4}deg)`;
            });
        }

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            permissionBanner.style.display = 'block';
            permissionBtn.addEventListener('click', () => {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            permissionBanner.style.display = 'none';
                            window.addEventListener('deviceorientation', handleMotion, true);
                        }
                    })
                    .catch(console.error);
            });
        } else {
            window.addEventListener('deviceorientation', handleMotion, true);
            window.addEventListener('deviceorientationabsolute', handleMotion, true);
        }

        // --- Popup System Controls ---
        function showMessage(text) {
            popupText.innerText = text;
            overlay.classList.add('active');
        }

        function closeMessage() {
            overlay.classList.remove('active');
        }
    </script>
</body>
</html>
