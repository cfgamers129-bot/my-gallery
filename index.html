<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            padding: 20px;
        }
        .secured-content {
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        h1 {
            color: #ff477e;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
        }
        p.hint {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            text-align: center;
        }
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 800px;
            perspective: 1200px; /* Enhanced 3D perspective depth */
        }
        .photo-card {
            background: white;
            padding: 12px 12px 25px 12px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            cursor: pointer;
            /* Smooth dynamic bounce filter effect for fluid transition */
            transition: transform 0.15s cubic-box(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s ease;
            position: relative;
            width: 220px;
            transform-style: preserve-3d;
        }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
            pointer-events: none;
        }
        .message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            padding: 20px;
        }
        .message-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .message-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        .message-overlay.active .message-box {
            transform: scale(1);
        }
        .message-box h2 {
            color: #ff477e;
            margin-bottom: 15px;
        }
        .message-box p {
            color: #333;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #ff477e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <script>
        const sothikPassword = "msd07"; 
        const userEntered = prompt("Enter the secret key to access this page:");
        
        if (userEntered !== sothikPassword) {
            alert("Wrong password! Access Denied.");
            document.body.innerHTML = "<div style='min-height:100vh; display:flex; justify-content:center; align-items:center; background:#111; color:#ff477e; font-family:sans-serif; font-size:24px; font-weight:bold;'>Access Denied. 🔒</div>";
        }
    </script>

    <div class="secured-content" id="main-content">
        <h1>Hey! ✨</h1>
        <p class="hint">(Try tilting/jiggling your mobile phone or click a picture)</p>

        <div class="gallery-container">
            <div class="photo-card" onclick="showMessage('You look beautiful in this picture! 😊')">
                <img src="pic1.jpg" alt="Photo 1">
            </div>
            
            <div class="photo-card" onclick="showMessage('This one has a great vibe! ✨')">
                <img src="pic2.jpg" alt="Photo 2">
            </div>

            <div class="photo-card" onclick="showMessage('Keep smiling always! 🌸')">
                <img src="pic3.jpg" alt="Photo 3">
            </div>
        </div>
    </div>

    <div class="message-overlay" id="msg-overlay">
        <div class="message-box">
            <h2>A Message For You</h2>
            <p id="popup-text">Custom Text</p>
            <button class="close-btn" onclick="closeMessage()">Close</button>
        </div>
    </div>

    <script>
        if(document.getElementById('main-content')) {
            document.getElementById('main-content').style.display = 'flex';
        }

        const cards = document.querySelectorAll('.photo-card');
        const overlay = document.getElementById('msg-overlay');
        const popupText = document.getElementById('popup-text');

        // Enhanced Jiggle Handler
        function handleMotion(event) {
            let tiltX = event.gamma ? event.gamma : 0; 
            let tiltY = event.beta ? event.beta : 0;   

            // Limits bariye dewa hoyeche jate chobi gulo aro beshi slide korte pare
            let moveX = Math.max(-60, Math.min(60, tiltX));
            let moveY = Math.max(-60, Math.min(60, tiltY - 45)); 

            cards.forEach((card, index) => {
                // Multipliers barano hoyeche dynamic push thakbe chobite
                let multiplier = (index % 2 === 0) ? 1.5 : 1.1; 
                let currentX = moveX * multiplier;
                let currentY = moveY * multiplier;
                
                // Rotation angles-o bariye dewa hoyeche hyper-responsive effects-er jonno
                card.style.transform = `translate3d(${currentX}px, ${currentY}px, 20px) rotateY(${currentX * 0.25}deg) rotateX(${-currentY * 0.25}deg)`;
            });
        }

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', handleMotion, true);
            window.addEventListener('deviceorientationabsolute', handleMotion, true);
        }

        function showMessage(text) {
            popupText.innerText = text;
            overlay.classList.add('active');
        }

        function closeMessage() {
            overlay.classList.remove('active');
        }
    </script>
</body>
</html>
